<!doctype html>
<html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>程式測試及除錯實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: numbered tabs, one "lab bench" per tab; every bench pairs a requirement with an editor students run and check. */
:root{
  --paper:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#18212B; --muted:#56616B; --line:#CDD6D1;
  --accent:#0E6B66; --accent-soft:#D5ECE9;
  --ok:#2F7D3A; --ok-soft:#DDF0DF; --bad:#B42318; --bad-soft:#FBE3E0; --warn:#9A5B00; --warn-soft:#FBEED6;
  --syn:#7A4FD0; --run:#C8372D; --log:#0E6B66;
  --code-bg:#1C232D; --code-fg:#E6EDF3; --code-dim:#7D8A99; --code-hl:#2D3A4A; --code-kw:#F0A86B; --code-str:#9ED69B; --code-num:#8FC7FF; --code-com:#7D8A99; --code-cur:#3B4A2A;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171C; --surface:#182129; --sunk:#0D1317; --ink:#E5ECEA; --muted:#9AA8AE; --line:#2B3842;
  --accent:#5CC4BB; --accent-soft:#163A38;
  --ok:#6FD07D; --ok-soft:#173523; --bad:#FF8A7E; --bad-soft:#3E1C19; --warn:#F2B75E; --warn-soft:#3A2A10;
  --syn:#B79BFF; --run:#FF8A7E; --log:#5CC4BB;
  --code-bg:#0B1015; --code-hl:#1F2B38; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171C; --surface:#182129; --sunk:#0D1317; --ink:#E5ECEA; --muted:#9AA8AE; --line:#2B3842;
  --accent:#5CC4BB; --accent-soft:#163A38;
  --ok:#6FD07D; --ok-soft:#173523; --bad:#FF8A7E; --bad-soft:#3E1C19; --warn:#F2B75E; --warn-soft:#3A2A10;
  --syn:#B79BFF; --run:#FF8A7E; --log:#5CC4BB;
  --code-bg:#0B1015; --code-hl:#1F2B38; color-scheme:dark}

html{font-size:16px}
*{box-sizing:border-box;font-variant-ligatures:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:900}
h2{font-size:clamp(1.4rem,3vw,1.8rem);font-weight:900}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
code,.mono,pre,textarea.ed{font-family:var(--f-mono)}
:not(pre)>code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:.9em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cite{color:var(--muted);font-size:.8rem;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.875rem}
[hidden]{display:none!important}

/* header + tabs */
header.top{padding-block:28px 0;display:grid;gap:6px}
.top-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.lang-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.size-ctl{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.size-ctl button{width:2.3rem;height:2rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700}
.size-ctl button:hover{border-color:var(--accent);color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--line);margin:14px 0 24px}
nav.tabs button{flex:none;background:none;border:0;padding:10px 14px 9px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button .n{font-family:var(--f-mono);font-size:.8em;margin-right:6px;color:var(--line)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button[aria-selected="true"] .n{color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}

section.tab{display:grid;gap:20px}
.bench-head{display:grid;gap:8px}
.bench-head .tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;color:var(--accent);font-weight:600}
.goal{max-width:70ch;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.scene{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.pill{font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.95rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* static code */
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:12px 0;overflow-x:auto;font-size:.875rem;line-height:1.65}
pre.code .ln{display:block;padding:0 16px 0 0;white-space:pre}
pre.code .ln::before{content:attr(data-n);display:inline-block;width:2.6em;padding-right:.9em;text-align:right;color:var(--code-dim);user-select:none}
.kw{color:var(--code-kw)}.st{color:var(--code-str)}.nu{color:var(--code-num)}.cm{color:var(--code-com);font-style:italic}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.875rem;font-weight:500;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover:not(:disabled){color:var(--surface);filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
td.num,td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td pre{margin:0;font-family:var(--f-mono);font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere}

/* task list layout (left list + main) */
.tasks{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:16px;align-items:start}
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.tlist button{display:grid;grid-template-columns:1.8rem minmax(0,1fr) 1.2rem;gap:6px;align-items:center;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer}
.tlist button:hover{background:var(--sunk)}
.tlist button.cur{background:var(--accent-soft)}
.tlist .qn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tlist button.cur .qn{color:var(--accent);font-weight:600}
.tlist .qt{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .qs{color:var(--ok);font-weight:700;text-align:center}
.tlist .prog{font-size:.8rem;color:var(--muted);padding:6px 8px 4px}
@media (max-width:860px){
  .tasks{grid-template-columns:minmax(0,1fr)}
  .tlist{position:static;display:flex;flex-wrap:wrap;gap:4px}
  .tlist button{grid-template-columns:auto auto;padding:4px 10px;border:1px solid var(--line)}
  .tlist .qt{display:none}
  .tlist .prog{width:100%}
}

/* requirement box */
.req{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.req b.t{font-family:var(--f-display);color:var(--warn);margin-right:6px}

/* editor */
.edbox{display:grid;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--code-bg);background:var(--code-bg)}
.edbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--code-hl);color:var(--code-fg);font-size:.8rem}
.edbar button{background:none;border:1px solid var(--code-dim);color:var(--code-fg);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.edbar button:hover{border-color:var(--code-fg)}
.edgrid{display:grid;grid-template-columns:auto minmax(0,1fr);max-height:28rem;overflow:auto}
.gutter{padding:10px 8px 10px 10px;text-align:right;color:var(--code-dim);font-family:var(--f-mono);font-size:.875rem;line-height:1.65;user-select:none;white-space:pre}
.gutter .e{color:#FF8A7E;font-weight:700}
textarea.ed{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--code-fg);font-size:.875rem;line-height:1.65;padding:10px 12px 10px 4px;white-space:pre;overflow:hidden;tab-size:4;caret-color:#E8D44D;min-height:6rem}
textarea.ed:focus-visible{outline:none}
.edbox:focus-within{box-shadow:0 0 0 3px var(--accent)}
pre.code.fill{border-radius:0}
pre.code .ln.errl::before{color:#FF8A7E;font-weight:700}
input.blank{font-family:var(--f-mono);font-size:inherit;line-height:1.3;color:var(--code-fg);background:var(--code-hl);border:0;border-bottom:2px solid #E8D44D;border-radius:4px 4px 0 0;padding:1px 6px;margin:0 2px;min-width:12ch;max-width:100%}
input.blank:focus-visible{outline:2px solid #E8D44D;outline-offset:1px}
.own{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:620px){.own{grid-template-columns:minmax(0,1fr)}}
.own textarea{width:100%;font-family:var(--f-mono);font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);resize:vertical;min-height:4.2rem}
.console{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-mono);font-size:.85rem;border-radius:8px;padding:8px 12px;min-height:4.2rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:14rem;overflow:auto}
.console .err{color:#FF8A7E}
.lab{font-size:.75rem;letter-spacing:.08em;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.verdict{font-weight:700;padding:9px 12px;border-radius:8px}
.verdict small{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
tr.pass td.res{color:var(--ok);font-weight:700}
tr.fail td.res{color:var(--bad);font-weight:700}
tr.fail td.act{background:var(--bad-soft)}
.etag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;font-family:var(--f-body);white-space:nowrap}
.etag.syntax{color:var(--syn);border:1px solid var(--syn)}
.etag.runtime{color:var(--run);border:1px solid var(--run)}
.etag.logic{color:var(--log);border:1px solid var(--log)}
.hint{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.loading{font-size:.85rem;color:var(--muted)}
.ctable td:nth-child(3){white-space:nowrap}

/* boundary */
.numline{width:100%;overflow-x:auto}
.numline svg{display:block;width:100%;min-width:520px;height:auto}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addrow input{width:9rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cat{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.cat.normal{background:var(--ok-soft);color:var(--ok)}
.cat.edge{background:var(--warn-soft);color:var(--warn)}
.cat.invalid{background:var(--bad-soft);color:var(--bad)}
.x{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 4px}
.cover{display:grid;gap:10px;align-content:start}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cv{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;display:grid;gap:2px}
.cv.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.cv b{font-family:var(--f-mono);font-size:.82rem}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.goals{display:grid;gap:6px;font-size:.92rem;margin:0;padding:0;list-style:none}
.goals li{display:flex;gap:8px}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:3px;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.tick.done{border-color:var(--ok);background:var(--ok);color:var(--surface)}

/* error types */
.etype{display:grid;gap:6px;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.etype h3{display:flex;gap:8px;align-items:center}
.etype .sw{width:12px;height:12px;border-radius:3px;flex:none}
.etype dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.etype dt{color:var(--muted);font-weight:700}
.etype dd{margin:0}
.t-syntax{--c:var(--syn)}.t-runtime{--c:var(--run)}.t-logic{--c:var(--log)}
.etype .sw{background:var(--c)}
pre.code.pick .ln{cursor:pointer}
pre.code.pick .ln:hover{background:var(--code-hl)}
pre.code .ln.sel{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--code-kw)}
pre.code .ln.good{background:rgba(111,208,125,.18);box-shadow:inset 3px 0 0 #6FD07D}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:8px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem}
.choice[aria-pressed="true"]{border-color:var(--c);color:var(--c)}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb h4{margin:0;font-size:.95rem}
.stepno{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;color:var(--accent);font-weight:600}

/* tracer */
.dbg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.dbg{grid-template-columns:1fr}}
pre.code .ln.cur{background:var(--code-cur);box-shadow:inset 3px 0 0 #E8D44D}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.var{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.var .k{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.var .v{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.var.chg{border-color:var(--warn);background:var(--warn-soft)}
.trace{max-height:280px;overflow:auto}
.trace tr.now td{background:var(--warn-soft)}

/* efficiency */
.hwrow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.hw{aspect-ratio:1/1.1;max-width:100%;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:.75rem;line-height:1.2;padding:2px;text-align:center}
.hw b{display:block;font-family:var(--f-mono);font-size:.875rem}
.hw.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.scan{display:grid;grid-template-columns:72px repeat(10,minmax(0,1fr));gap:6px;align-items:center;font-size:.8rem}
.scan .lab2{font-weight:700;font-family:var(--f-mono)}
.scan i{display:block;height:14px;border-radius:4px;background:var(--sunk)}
.scan i.on{background:var(--accent)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.count{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.count .n{font-family:var(--f-mono);font-size:1.8rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.predict{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.predict input{width:6rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--f-mono)}
.slider{display:grid;gap:4px}
.slider input{width:100%;accent-color:var(--accent)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:.875rem}
.bar .track{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar .track i.mem{background:var(--warn)}
.bar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}

/* quiz */
.mcq{display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.95rem;align-items:start}
.opt .lt{font-family:var(--f-mono);font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .why{grid-column:2;font-size:.85rem;color:var(--muted)}
.opt:disabled{cursor:default;color:var(--ink)}
.score{font-family:var(--f-mono);font-weight:600}
footer{margin-top:32px;font-size:.85rem;color:var(--muted);display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.hwrow{grid-template-columns:repeat(5,minmax(0,1fr))}.scan{grid-template-columns:52px repeat(10,minmax(0,1fr));gap:3px}}
</style>
</head><body>

<div class="wrap" id="app"></div>

<!-- ======================= 中文版 ======================= -->
<template id="tpl-zh">
<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow">必修 D(d)　計算思維與程式編寫 · Python</div>
      <h1>程式測試及除錯實驗室</h1>
    </div>
    <div class="top-tools">
      <button type="button" class="lang-btn" id="langBtn" lang="en">⇄ English</button>
      <div class="size-ctl"><span>字體</span><button type="button" id="fontDown" aria-label="縮小字體">A−</button><button type="button" id="fontUp" aria-label="放大字體">A+</button></div>
    </div>
  </div>
  <p class="muted small" id="engineMsg"></p>
</header>
<nav class="tabs" role="tablist" aria-label="教學單元">
  <button type="button" role="tab" data-tab="valid" aria-selected="true"><span class="n">1</span>有效性檢驗</button>
  <button type="button" role="tab" data-tab="boundary" aria-selected="false"><span class="n">2</span>邊界測試</button>

<section class="tab" id="tab-errors" role="tabpanel" hidden>
  <div class="bench-head">
    <div class="tag">學習目標 2 · 錯誤類型、原因及除錯</div>
    <h2>錯誤偵查：分辨、改正、再測試</h2>
    <p class="goal">判斷錯誤類型時問兩個問題：程式能否開始執行？執行後會否中途停止？每題先點選出錯的一行及錯誤類型，答對後在編輯器改正程式，按「核對」確認改得對。</p>
  </div>
  <div class="grid3">
    <div class="etype t-syntax"><h3><i class="sw"></i>語法錯誤</h3>
      <dl><dt>何時</dt><dd>翻譯程式碼時</dd><dt>結果</dt><dd>程式不能執行</dd><dt>原因</dt><dd>違反程式語言的規則，如漏了冒號、括號不對稱、拼錯關鍵字</dd><dt>除錯</dt><dd>按錯誤訊息的行號改正</dd></dl></div>
    <div class="etype t-runtime"><h3><i class="sw"></i>運行時錯誤</h3>
      <dl><dt>何時</dt><dd>程式執行期間</dd><dt>結果</dt><dd>程式中途停止（崩潰）</dd><dt>原因</dt><dd>執行了不能完成的操作，如除以零、索引超出範圍、輸入不能轉換為數字</dd><dt>除錯</dt><dd>看錯誤訊息的行號；加入有效性檢驗</dd></dl></div>
    <div class="etype t-logic"><h3><i class="sw"></i>邏輯錯誤</h3>
      <dl><dt>何時</dt><dd>程式能完成執行</dd><dt>結果</dt><dd>輸出不正確，或陷入無限循環</dd><dt>原因</dt><dd>算法設計錯誤，如條件、初始值或循環範圍錯誤</dd><dt>除錯</dt><dd>比較預期及實際輸出；用追蹤表逐行檢查</dd></dl></div>
  </div>
  <div class="tasks" id="errTasks"></div>
  <p class="small muted">公開試亦有這類題目：指出程式段第幾行有語法、邏輯或運行時錯誤，題目會並列三種語言版本。〔2026 1A Q37–38〕</p>
</section>

  <div class="card">
    <div class="scene"><span class="pill">情境</span><span>班主任鼓勵同學每日行 10000 步或以上。志明記錄了一星期的步數，想計算達標日數。11000、10000、12000、10000、15000 都達標，<b>預期輸出是 5</b>。</span></div>

        </table></div>
      </div>
    </div>
    <div class="note">追蹤到第幾行時，發現與預期不同？想一想：第一日的 11000 有沒有被檢查？10000 步算不算達標？</div>
  </div>

<section class="tab" id="tab-efficiency" role="tabpanel" hidden>

    <h2>收功課：比較兩個算法的執行步數</h2>
    <p class="goal">兩個算法輸出相同，不代表效率相同。比較時要數清楚某句語句的<b>執行次數</b>，並說明在甚麼數據下才有分別。</p>
  </div>
  <div class="card">
    <div class="scene"><span class="pill">情境</span><span>科長要檢查 10 位同學是否全部已交功課。點擊格子切換「已交」或「未交」，先預測比較次數，再按「顯示」。</span></div>
    <div class="hwrow" id="hwRow"></div>
    <div class="grid2">
      <div style="display:grid;gap:6px;min-width:0"><b>ALG1：for 循環檢查每一份</b><pre class="code" id="alg1"></pre></div>
      <div style="display:grid;gap:6px;min-width:0"><b>ALG2：while 循環，發現未交即停止</b><pre class="code" id="alg2"></pre></div>

    <div class="predict">
      <label for="pr1" class="small"><b>預測</b>　ALG1 比較次數</label><input id="pr1" inputmode="numeric">

      <button class="btn primary" id="prShow">顯示</button>
      <span class="small" id="prFb"></span>
    </div>
    <div id="hwReveal" hidden style="display:grid;gap:10px">
      <div style="display:grid;gap:6px">
        <div class="small muted">每格代表 <code>hw[i] == False</code> 被執行一次</div>
        <div class="scan" id="scan1"></div>
        <div class="scan" id="scan2"></div>
      </div>
      <div class="counts">
        <div class="count"><div class="small muted">ALG1 比較次數</div><div class="n" id="c1"></div></div>
        <div class="count"><div class="small muted">ALG2 比較次數</div><div class="n" id="c2"></div></div>
        <div class="count"><div class="small muted">兩者輸出 all_done</div><div class="n" id="c3" style="font-size:1.3rem"></div></div>
      </div>
    </div>
    <div class="note"><b>答題時：</b>寫「ALG2 較有效率，因為一發現未交的功課便停止，<code>hw[i] == False</code> 的執行次數較少」。只寫「因為用 while 循環」不會得分。如全部已交，兩者都要比較 10 次。<span class="cite">〔2022 1B Q5(c)(ii)〕〔改編自 2024 1A Q28〕</span></div>
  </div>
  <div class="card">
    <div class="stepno">動手改寫</div>
    <div class="req"><b class="t">要求</b>以下 ALG1 加入了計數器 <code>checks</code>，記錄比較了多少次。把它改寫為 while 循環，令程式一發現未交的功課便停止，輸出不變，但 <code>checks</code> 減少。不可使用 <code>break</code>。核對時會換上其他 <code>hw</code> 列表。</div>
    <div id="effTask" style="display:grid;gap:14px"></div>
  </div>
  <div class="card">
    <div class="bench-head">
      <div class="tag">學習目標 3 · 資源運用</div>
      <h3>儲錢計劃：執行步數與記憶體的取捨</h3>
    </div>
    <div class="scene"><span class="pill">情境</span><span>小珊第 1 日存 $1，第 2 日存 $2……第 N 日存 $N。三個方法都能計算 N 日後共存多少錢。拉動滑桿改變 N。</span></div>

    <div class="grid3">
      <div style="display:grid;gap:6px;min-width:0"><b>方法甲：循環累加</b><pre class="code" id="mA"></pre></div>
      <div style="display:grid;gap:6px;min-width:0"><b>方法乙：數學公式</b><pre class="code" id="mB"></pre></div>
      <div style="display:grid;gap:6px;min-width:0"><b>方法丙：先存入列表再加</b><pre class="code" id="mC"></pre></div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="note">方法乙的步數不會隨 N 增加，最有效率。方法丙的結果相同，但要多用一個有 N 個項目的列表，佔用較多<b>記憶體</b>，步數亦較多。若算法本身步數多，單靠增加 RAM 不能明顯縮短執行時間，因為瓶頸在執行步數。<span class="cite">〔改編自 2024 1A Q28〕</span></div>
  </div>

    <h2>Sports Day online entry form: write your own validation</h2>
    <p class="goal">For each field in the table, write a Python program that checks its requirement, then press <b>Check</b>. The page runs your program with a set of test data (normal, boundary and invalid data) and compares each output.</p>
  </div>
  <div class="card">
    <div class="scene"><span class="pill">Scenario</span><span>The school's Sports Day now takes entries online. Each student may enter at most 3 events. The system must check the input before storing it in the database.</span></div>
    <div class="tablewrap"><table class="ctable">
      <thead><tr><th>Field</th><th>Requirement</th><th>Validation check</th><th>Task</th></tr></thead>
      <tbody>
        <tr><td>Name</td><td>Must not be empty</td><td>Completeness check 完整性檢查</td><td class="mono">1</td></tr>
        <tr><td>Class</td><td>Only 4A–4D, 5A–5D, 6A–6D</td><td>Fixed value check 固定值檢查</td><td class="mono">2</td></tr>
        <tr><td>Phone number</td><td>Exactly 8 characters</td><td>Length check 長度檢查</td><td class="mono">3</td></tr>
        <tr><td>Phone number</td><td>Every character is a digit</td><td>Type check 類型檢查</td><td class="mono">4</td></tr>
        <tr><td>Phone number</td><td>First digit is 5, 6 or 9 (mobile number)</td><td>Format check 格式檢查</td><td class="mono">5</td></tr>
        <tr><td>Number of events</td><td>An integer from 1 to 3</td><td>Range check 範圍檢查</td><td class="mono">6</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="tasks" id="validTasks"></div>
  <div class="note"><b>Validation is not verification.</b> Asking the user to enter the phone number twice and comparing them is <b>verification</b> 驗證, which detects mistakes made while typing. The length and range checks above are validation 有效性檢驗. A phone number that passes every check may still belong to someone else. <span class="cite">[2025 1A Q6, Q31] [2018 1B Q4(c)]</span></div>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const store={get(k){try{return localStorage.getItem("ptd-"+k)}catch(e){return null}},set(k,v){try{localStorage.setItem("ptd-"+k,v)}catch(e){}}};
const engineOK=!!(window.Sk&&Sk.builtinFiles);
const SIZES=[14,15,16,18,20,22];let sizeIdx=SIZES.indexOf(+store.get("size"));if(sizeIdx<0)sizeIdx=2;

/* ---------- highlighter ---------- */
function hl(line){
  let out="",i=0;
  const KW=/^(for|in|if|elif|else|while|and|or|not|print|range|len|int|input|True|False|append)\b/;
  while(i<line.length){
    const r=line.slice(i);let m;
    if(r[0]==="#"){out+=`<span class="cm">${esc(r)}</span>`;break}
    if(r[0]==='"'){const j=line.indexOf('"',i+1);const e=j<0?line.length:j+1;out+=`<span class="st">${esc(line.slice(i,e))}</span>`;i=e;continue}
    if((m=r.match(KW))&&(i===0||!/[\w.]/.test(line[i-1])||m[1]==="append")){out+=`<span class="kw">${m[1]}</span>`;i+=m[1].length;continue}
    if((m=r.match(/^\d+/))&&(i===0||!/\w/.test(line[i-1]))){out+=`<span class="nu">${m[0]}</span>`;i+=m[0].length;continue}
    out+=esc(r[0]);i++;
  }
  return out;
}
function renderCode(el,lines){el.innerHTML=lines.map((l,k)=>`<span class="ln" data-n="${k+1}">${hl(l)||" "}</span>`).join("");}
const codeHTML=src=>`<pre class="code">${src.split("\n").map((l,k)=>`<span class="ln" data-n="${k+1}">${hl(l)||" "}</span>`).join("")}</pre>`;

/* ---------- Python runner (Skulpt) ---------- */
let queue=Promise.resolve();
function runPy(code,inputs){const job=queue.then(()=>runPyNow(code,inputs));queue=job.catch(()=>{});return job}
async function runPyNow(code,inputs){
  if(!engineOK)return{out:"",err:{tp:"EngineError",kind:"engine",msg:"Python engine not loaded",line:null}};
  let out="";const q=(inputs||[]).map(String);
  Sk.configure({
    output:t=>{if(out.length<6000)out+=t},
    read:x=>{const f=Sk.builtinFiles.files[x];if(f===undefined)throw"File not found: '"+x+"'";return f},
    inputfun:()=>q.length?q.shift():"",
    inputfunTakesPrompt:true,execLimit:1500,yieldLimit:100,__future__:Sk.python3
  });
  try{
    await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true));
    return{out};
  }catch(e){
    let tp=e&&e.tp$name?e.tp$name:"Error",line=null,msg="";
    try{line=e.traceback&&e.traceback[0]?e.traceback[0].lineno:null}catch(_){}
    try{msg=e.args.v.map(a=>Sk.ffi.remapToJs(a)).join(" ")}catch(_){msg=String(e)}
    const kind=/SyntaxError|IndentationError|TokenError|TabError/.test(tp)?"syntax":tp==="TimeLimitError"?"timeout":"runtime";
    return{out,err:{tp,kind,msg,line}};
  }
}
const norm=s=>s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");

/* ================= start(lang): render template + build everything ================= */
function start(LANG){
const zh=LANG==="zh",L=(a,b)=>zh?a:b;
store.set("lang",LANG);
document.documentElement.lang=zh?"zh-Hant-HK":"en";
document.title=L("程式測試及除錯實驗室","Program Testing and Debugging Lab");
$("#app").innerHTML=document.getElementById("tpl-"+LANG).innerHTML;
$("#langBtn").onclick=()=>start(zh?"en":"zh");

/* tabs + font size */
const TABS=[...document.querySelectorAll("nav.tabs button")];
function showTab(name){
  if(!document.getElementById("tab-"+name))name="valid";
  TABS.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===name)));
  document.querySelectorAll("section.tab").forEach(s=>s.hidden=s.id!=="tab-"+name);
  store.set("tab",name);
  document.querySelectorAll("textarea.ed").forEach(t=>t.dispatchEvent(new Event("fit")));
}
TABS.forEach(b=>b.addEventListener("click",()=>{showTab(b.dataset.tab);window.scrollTo({top:0})}));
function applySize(){document.documentElement.style.fontSize=SIZES[sizeIdx]+"px";store.set("size",SIZES[sizeIdx]);document.querySelectorAll("textarea.ed").forEach(t=>t.dispatchEvent(new Event("fit")))}
$("#fontDown").onclick=()=>{sizeIdx=Math.max(0,sizeIdx-1);applySize()};
$("#fontUp").onclick=()=>{sizeIdx=Math.min(SIZES.length-1,sizeIdx+1);applySize()};
applySize();
$("#engineMsg").innerHTML=engineOK?L("Python 執行環境已準備好：所有編輯器都可以直接修改及執行。","Python is ready: every editor on this page can be edited and run."):`<span style="color:var(--bad)">${L("未能載入 Python 執行環境，請檢查網絡後重新整理頁面。示範部分仍可使用。","The Python engine could not be loaded. Check the network and reload the page. The demonstrations still work.")}</span>`;

/* error display */
const KIND={syntax:L("語法錯誤","Syntax error"),runtime:L("運行時錯誤","Run-time error"),timeout:L("邏輯錯誤","Logic error"),engine:L("未能執行","Not run")};
function errText(err){
  if(err.kind==="engine")return L("Python 執行環境未載入",err.msg);
  const ln=err.line?L("（第 "+err.line+" 行）"," (line "+err.line+")"):"";
  if(err.kind==="timeout")return L("執行超過時限：可能是無限循環","Time limit exceeded: probably an infinite loop")+ln;
  return`${err.tp}${ln}${L("：",": ")}${err.msg}`;
}
function errHTML(err){const k=err.kind==="timeout"?"logic":err.kind==="engine"?"runtime":err.kind;return`<span class="etag ${k}">${KIND[err.kind]}</span> ${esc(errText(err))}`}
const NOOUT=`<span class="muted">${L("（沒有輸出）","(no output)")}</span>`;
const showOut=s=>s===""?NOOUT:esc(s);

/* code editor */
function makeEditor(host,code,opts={}){
  const title=opts.title||L("Python 程式（可修改）","Python program (editable)");
  host.innerHTML=`<div class="edbox"><div class="edbar"><span>${esc(title)}</span><button type="button" data-reset>${L("還原","Reset")}</button></div><div class="edgrid"><div class="gutter"></div><textarea class="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${esc(title)}"></textarea></div></div>`;
  const ta=host.querySelector("textarea"),gut=host.querySelector(".gutter");let errLine=null;
  const fit=()=>{const n=ta.value.split("\n").length;gut.innerHTML=Array.from({length:n},(_,k)=>k+1===errLine?`<span class="e">${k+1}</span>`:String(k+1)).join("\n");ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";};
  ta.value=code;
  ta.addEventListener("fit",fit);
  ta.addEventListener("input",()=>{errLine=null;fit();opts.onChange&&opts.onChange()});
  ta.addEventListener("keydown",e=>{
    if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ta.setRangeText("    ",ta.selectionStart,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"))}
    else if(e.key==="Enter"&&!e.isComposing){
      const s=ta.selectionStart,before=ta.value.slice(0,s),cur=before.slice(before.lastIndexOf("\n")+1);
      let ind=(cur.match(/^ */)||[""])[0];if(/:\s*(#.*)?$/.test(cur))ind+="    ";
      e.preventDefault();ta.setRangeText("\n"+ind,s,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"));
    }
  });
  host.querySelector("[data-reset]").onclick=()=>{ta.value=code;errLine=null;fit();opts.onChange&&opts.onChange()};
  requestAnimationFrame(fit);fit();
  return{get:()=>ta.value,mark:l=>{errLine=l;fit()}};
}

/* fill-in-the-blank editor: "____" in the template becomes an input box */
function makeBlank(host,tpl,onEnter){
  const title=L("Python 程式（填寫空格）","Python program (fill in the blank)");
  const parts=tpl.split("____");
  host.innerHTML=`<div class="edbox"><div class="edbar"><span>${esc(title)}</span><button type="button" data-reset>${L("還原","Reset")}</button></div><pre class="code fill"></pre></div>`;
  const pre=host.querySelector("pre");let n=0;
  pre.innerHTML=tpl.split("\n").map((l,k)=>`<span class="ln" data-n="${k+1}">${l.split("____").map(hl).join("\u0000")||" "}</span>`).join("").replace(/\u0000/g,()=>`<input class="blank" data-b="${n++}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${L("空格","Blank")} ${n}">`);
  const boxes=[...pre.querySelectorAll("input.blank")];
  const size=b=>{b.style.width=Math.max(12,b.value.length+2)+"ch"};
  boxes.forEach(b=>{size(b);b.addEventListener("input",()=>{size(b);mark(null)});b.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();onEnter&&onEnter()}})});
  function mark(l){pre.querySelectorAll(".ln").forEach(x=>x.classList.toggle("errl",+x.dataset.n===l))}
  host.querySelector("[data-reset]").onclick=()=>{boxes.forEach(b=>{b.value="";size(b)});mark(null)};
  return{get:()=>parts.reduce((a,x,k)=>a+(k?boxes[k-1].value:"")+x,""),mark};
}

/* task runner: requirement + editor + tests */
function makeTask(host,t,onPass){
  host.innerHTML=`${t.req?`<div class="req"><b class="t">${L("要求","Task")}</b>${t.req}</div>`:""}<div data-ed></div>
  <div class="row"><button class="btn primary" data-run>${L("核對","Check")}</button><span class="small muted">${t.lastLine?L("只核對最後一行輸出。","Only the last line of output is checked."):""}</span></div>

  }

    const ask=typeOK?"":L("想想：這個程式能否開始執行？執行時會否中途停止？","Think: can this program start running? Does it stop part way?");
    fb.hidden=false;fb.className="fb no";

    if(tries>=2)revealBtn.hidden=false;
  };
